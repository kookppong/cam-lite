<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh;
      background: transparent;
      overflow: hidden;
      cursor: crosshair;
    }
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.42);
    }
    #selBox {
      position: fixed;
      border: 2px solid #ef4444;
      background: rgba(239,68,68,0.08);
      display: none;
      pointer-events: none;
    }
    #sizeLabel {
      position: fixed;
      background: rgba(15,16,21,0.92);
      color: #38bdf8;
      border: 1px solid #3b82f6;
      font: bold 12px/1 Consolas, monospace;
      padding: 4px 8px;
      border-radius: 4px;
      display: none;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15,16,21,0.94);
      border: 1px solid #3b3c4e;
      border-radius: 14px;
      padding: 20px 32px;
      text-align: center;
      color: #f1f2f6;
      font: 14px "Malgun Gothic", sans-serif;
      pointer-events: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
    #hint .title { font-weight: bold; font-size: 15px; margin-bottom: 6px; }
    #hint .sub { color: #9ca3af; font-size: 12px; }
    #hint .esc { color: #f87171; font-size: 11px; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <div id="selBox"></div>
  <div id="sizeLabel"></div>
  <div id="hint">
    <div class="title">🖱️ 녹화할 영역을 마우스로 드래그하세요</div>
    <div class="sub">주 모니터 및 서브 모니터 어디든 자유롭게 드래그할 수 있습니다</div>
    <div class="esc">취소: 키보드 ESC</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const selBox = document.getElementById('selBox');
    const sizeLabel = document.getElementById('sizeLabel');
    const hint = document.getElementById('hint');

    let startScreenX = 0, startScreenY = 0;
    let startClientX = 0, startClientY = 0;
    let dragging = false;

    document.addEventListener('mousedown', e => {
      dragging = true;
      startScreenX = e.screenX;
      startScreenY = e.screenY;
      startClientX = e.clientX;
      startClientY = e.clientY;

      hint.style.display = 'none';
      selBox.style.display = 'block';
      selBox.style.left = startClientX + 'px';
      selBox.style.top = startClientY + 'px';
      selBox.style.width = '0px';
      selBox.style.height = '0px';

      sizeLabel.style.display = 'block';
      sizeLabel.textContent = '0 × 0';
    });

    document.addEventListener('mousemove', e => {
      if (!dragging) return;

      const drawX = Math.min(e.clientX, startClientX);
      const drawY = Math.min(e.clientY, startClientY);
      const drawW = Math.abs(e.clientX - startClientX);
      const drawH = Math.abs(e.clientY - startClientY);

      selBox.style.left = drawX + 'px';
      selBox.style.top = drawY + 'px';
      selBox.style.width = drawW + 'px';
      selBox.style.height = drawH + 'px';

      const screenW = Math.abs(e.screenX - startScreenX);
      const screenH = Math.abs(e.screenY - startScreenY);
      sizeLabel.textContent = `${screenW} × ${screenH}`;
      sizeLabel.style.left = (drawX + drawW + 8) + 'px';
      sizeLabel.style.top = (drawY + drawH + 8) + 'px';
    });

    document.addEventListener('mouseup', e => {
      if (!dragging) return;
      dragging = false;
      selBox.style.display = 'none';
      sizeLabel.style.display = 'none';

      const rx = Math.min(e.screenX, startScreenX);
      const ry = Math.min(e.screenY, startScreenY);
      const rw = Math.abs(e.screenX - startScreenX);
      const rh = Math.abs(e.screenY - startScreenY);

      if (rw < 30 || rh < 30) {
        ipcRenderer.send('area-cancelled');
        return;
      }

      ipcRenderer.send('area-confirmed', { x: rx, y: ry, w: rw, h: rh });
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        ipcRenderer.send('area-cancelled');
      }
    });
  </script>
</body>
</html>
