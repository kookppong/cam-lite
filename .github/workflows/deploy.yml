name: Build Desktop Installer & Deploy Web Test

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. 깃허브 웹 테스트 사이트 (GitHub Pages) 배포
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2. Windows 설치형 프로그램 (.exe / NSIS Installer & Portable) 빌드 및 릴리즈 등록
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suzicam-windows-build
          path: dist/*.exe

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "수지캠 (SuziCam) ${{ github.ref_name }} Windows 설치형 프로그램"
          body: |
            ## 🎬 수지캠 (SuziCam) ${{ github.ref_name }} 업데이트 안내
            
            사용자 피드백을 반영한 긴급 패치 버전입니다.
            
            ### 🛠️ 이번 버전 주요 수정사항
            1. **화면 내리기(최소화) 및 닫기 버튼 버그 수정**: 상단 타이틀바 `─`, `✕` 버튼 정상 작동
            2. **다중 모니터 / 서브 모니터 영역 드래그 완벽 지원**: 주 모니터뿐만 아니라 보조 모니터, 세로 피벗 모니터 전체를 아우르는 가상 데스크톱 영역 선택 지원
            3. **특정 프로그램 창 선택 녹화 모드 추가**: 웹 버전처럼 실행 중인 창 목록을 미리보고 원하는 창만 선택하여 녹화 가능
            4. **백그라운드 창 전환 시 멈춤 현상 원천 차단**
            
            ### 📥 다운로드 링크
            * **SuziCam.${{ github.ref_name }}.exe**: 무설치 포터블 단독 실행 파일
            * **SuziCam.Setup.${{ github.ref_name }}.exe**: 정식 설치형 파일
          draft: false
          prerelease: false
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
