name: Build Desktop Installer & Deploy Web Test

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. 깃허브 웹 테스트 사이트 (GitHub Pages) 배포
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2. Windows 설치형 프로그램 (.exe / NSIS Installer & Portable) 빌드 및 릴리즈 등록
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      # FFmpeg 바이너리 다운로드 및 resources/ 폴더에 배치
      - name: Download FFmpeg Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "resources"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Write-Host "Downloading FFmpeg from: $url"
          Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip"
          Expand-Archive "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          $ffmpegExe = Get-ChildItem -Path "ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName "resources/ffmpeg.exe"
          $sizeMB = [math]::Round((Get-Item "resources/ffmpeg.exe").Length / 1MB, 1)
          Write-Host "FFmpeg binary: $sizeMB MB"
          Remove-Item "ffmpeg.zip" -Force
          Remove-Item "ffmpeg-temp" -Recurse -Force

      - name: Build Windows Installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suzicam-windows-build
          path: dist/*.exe

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "수지캠 (SuziCam) ${{ github.ref_name }} Windows 설치형 프로그램"
          body: |
            ## 🎬 수지캠 (SuziCam) ${{ github.ref_name }} 업데이트 안내
            
            ### 🛠️ v0.1.3-test 주요 변경사항
            
            #### 🔥 핵심 개선: H.264 MP4 자동 변환 엔진 탑재
            - 녹화 종료 후 **FFmpeg H.264 MP4로 자동 변환** (내장 엔진)
            - **용량 3~5배 감소** (동일 화질 대비)
            - **탐색 바 이동 시 즉시 반응** (`-movflags +faststart` moov atom 최적 배치)
            - 모든 미디어 플레이어(PotPlayer, VLC, 크롬 등)에서 부드럽게 재생
            
            #### 📊 성능 개선
            - 녹화 중 메모리 절약: 임시 파일 직접 스트리밍 (기존 대비 메모리 50%+ 절감)
            - 변환 진행률 실시간 표시 (프로그레스 바 오버레이)
            - 다운로드 파일 포맷: `.mp4` (H.264 + AAC)
            
            #### 🔧 기존 기능 유지
            - 화면 내리기(최소화) 및 닫기 버튼 정상 작동
            - 다중 모니터 / 서브 모니터 영역 드래그 완벽 지원
            - 특정 프로그램 창 선택 녹화 모드 지원
            - 백그라운드 창 전환 시 멈춤 현상 원천 차단
            
            ### 📥 다운로드 링크
            * **SuziCam.${{ github.ref_name }}.exe**: 무설치 포터블 단독 실행 파일
            * **SuziCam.Setup.${{ github.ref_name }}.exe**: 정식 설치형 파일
          draft: false
          prerelease: false
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
