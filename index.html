<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수지캠 (SuziCam) v0.1.0-test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f1015;
      color: #f1f2f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      user-select: none;
    }
    .digital-font {
      font-family: 'Consolas', monospace;
      text-shadow: 0 0 12px rgba(80, 250, 123, 0.6);
    }
    .rec-pulse { animation: recblink 1.2s infinite; }
    @keyframes recblink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.96); }
    }
  </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">

  <div class="w-full max-w-lg bg-[#181920] border border-[#2b2d3a] rounded-2xl p-5 shadow-2xl space-y-4">

    <!-- 1. 타이틀 바 & 버전 -->
    <div class="flex items-center justify-between border-b border-[#2b2d3a] pb-3">
      <div class="flex items-center space-x-2">
        <span class="w-3.5 h-3.5 rounded-full bg-red-600 inline-block" style="box-shadow:0 0 8px #ff3333"></span>
        <h1 class="text-base font-extrabold tracking-wide text-white">수지캠 (SUZICAM)</h1>
        <span class="px-2 py-0.5 text-xs font-bold bg-red-950 text-red-300 border border-red-800 rounded-md">v0.1.0-test</span>
      </div>
      <div class="flex items-center space-x-2">
        <span id="envBadge" class="text-xs px-2 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-800">🌐 웹 테스트 모드</span>
        <span id="statusBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-neutral-800 text-green-400 font-semibold border border-neutral-700">대기 중</span>
      </div>
    </div>

    <!-- 2. 디지털 타이머 & 녹화 컨트롤 -->
    <div class="bg-black/90 border border-[#2b2d3a] rounded-xl p-4 text-center space-y-3">
      <div class="text-xs text-neutral-400 font-medium tracking-wider">녹화 시간 (RECORDING TIMER)</div>
      <div id="recTimer" class="digital-font text-5xl font-bold text-green-400">00:00:00.000</div>

      <div class="flex items-center justify-center space-x-3 pt-2">
        <button id="btnRec" onclick="handleRecordToggle()"
          class="px-6 py-3 rounded-xl font-bold text-sm bg-red-600 hover:bg-red-700 text-white transition-all flex items-center space-x-2 cursor-pointer"
          style="box-shadow:0 4px 15px rgba(255,0,0,0.4)">
          <span class="w-3 h-3 rounded-full bg-white inline-block"></span>
          <span id="btnRecText">녹화 시작 (REC)</span>
        </button>
        <button id="btnPause" onclick="handlePauseToggle()" disabled
          class="px-4 py-3 rounded-xl font-bold text-sm bg-neutral-800 text-neutral-500 cursor-not-allowed transition-all">
          ❚❚ 일시정지
        </button>
      </div>

      <div class="flex items-center justify-around pt-2 text-xs text-neutral-300 border-t border-neutral-800">
        <label class="flex items-center space-x-1 cursor-pointer">
          <input type="checkbox" id="chkAudio" checked class="accent-red-600 cursor-pointer">
          <span>오디오(시스템/마이크) 포함</span>
        </label>
        <div class="flex items-center space-x-1">
          <span>FPS:</span>
          <select id="selFps" class="bg-neutral-800 text-white rounded px-1.5 py-0.5 border border-neutral-700 text-xs">
            <option value="60" selected>60 FPS</option>
            <option value="30">30 FPS</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 3. 실시간 테스트 벤치 -->
    <div class="bg-[#12131a] border border-[#2b2d3a] rounded-xl p-3 space-y-2">
      <div class="text-xs font-bold text-neutral-300 flex items-center justify-between">
        <span>🧪 실시간 녹화 테스트 벤치</span>
        <span class="text-xs text-neutral-400 font-normal">녹화 중 화면 변화 검증</span>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <!-- FPS 모션 -->
        <div class="bg-black/60 border border-neutral-800 rounded-lg p-2.5 flex flex-col items-center">
          <div class="flex items-center justify-between w-full text-xs mb-1">
            <span class="text-neutral-400">FPS 모션 검증</span>
            <span id="fpsDisplay" class="text-cyan-400 font-mono font-bold">-- FPS</span>
          </div>
          <canvas id="motionCanvas" width="180" height="70" class="rounded bg-black border border-neutral-900"></canvas>
          <div class="text-xs text-neutral-400 mt-1">공의 잔상 및 프레임 드랍 확인</div>
        </div>

        <!-- 오디오 싱크 -->
        <div class="bg-black/60 border border-neutral-800 rounded-lg p-2.5 flex flex-col items-center justify-between">
          <div class="text-xs text-neutral-400 w-full text-left">오디오 싱크 검증</div>
          <button id="btnBeep" onclick="toggleBeepSound()"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-neutral-800 hover:bg-neutral-700 text-yellow-300 border border-neutral-700 cursor-pointer transition">
            🔈 1초 비프음 켜기
          </button>
          <div class="text-xs text-neutral-400 text-center">녹화본의 음성-화면 일치 확인</div>
        </div>
      </div>

      <!-- 마우스 클릭 -->
      <div id="clickTarget" onclick="handleClickTarget()"
        class="border border-dashed border-neutral-700 hover:border-red-500 rounded-lg py-2 text-center cursor-pointer transition bg-black/40">
        <span id="clickTargetText" class="text-xs text-neutral-300">
          🖱️ 마우스 클릭 테스트 (여기를 클릭하세요 — 감지: 0)
        </span>
      </div>
    </div>

    <!-- 4. 녹화 완료 미리보기 -->
    <div id="resultCard" class="hidden bg-[#12131a] border border-green-600/50 rounded-xl p-3 space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-green-400">✓ 녹화 완료!</span>
        <a id="btnDownload" href="#" download="SuziCam_Record.webm"
          class="px-3 py-1 text-xs font-bold bg-green-600 hover:bg-green-700 text-white rounded-lg transition">
          💾 영상 다운로드
        </a>
      </div>
      <video id="previewVideo" controls class="w-full rounded bg-black max-h-48 border border-neutral-800"></video>
    </div>

    <!-- 5. 푸터 -->
    <div class="flex items-center justify-between pt-2 border-t border-[#2b2d3a] text-xs text-neutral-400">
      <span>빌드: <span class="text-neutral-300 font-mono">v0.1.0-test (Alpha)</span></span>
      <a href="https://github.com/kookppong/cam-lite" target="_blank" class="hover:text-white underline transition">GitHub Repository</a>
    </div>
  </div>

  <script>
    // ── 환경 감지 ──
    const isElectron = !!(window.process && window.process.type);
    document.addEventListener('DOMContentLoaded', () => {
      const b = document.getElementById('envBadge');
      if (isElectron) {
        b.textContent = '🖥️ PC 데스크톱 설치 모드';
        b.className = 'text-xs px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800';
      }
    });

    // ── 디지털 타이머 ──
    const timerEl = document.getElementById('recTimer');
    let recStart = 0, isRecActive = false, isPaused = false, pausedTotal = 0, pauseStart = 0;

    function updateClock() {
      if (isRecActive) {
        const now = performance.now();
        const ms = isPaused
          ? pauseStart - recStart - pausedTotal
          : now - recStart - pausedTotal;
        const ts = Math.floor(ms / 1000);
        const h = String(Math.floor(ts / 3600)).padStart(2,'0');
        const m = String(Math.floor((ts % 3600) / 60)).padStart(2,'0');
        const s = String(ts % 60).padStart(2,'0');
        const msStr = String(Math.floor(ms % 1000)).padStart(3,'0');
        timerEl.textContent = `${h}:${m}:${s}.${msStr}`;
      } else {
        const d = new Date();
        timerEl.textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`;
      }
      requestAnimationFrame(updateClock);
    }
    requestAnimationFrame(updateClock);

    // ── 화면 녹화 (WebRTC MediaRecorder) ──
    let mediaRecorder = null, recordedChunks = [], captureStream = null;

    async function handleRecordToggle() {
      if (!isRecActive) {
        try {
          const fps = parseInt(document.getElementById('selFps').value) || 60;
          const withAudio = document.getElementById('chkAudio').checked;
          captureStream = await navigator.mediaDevices.getDisplayMedia({
            video: { frameRate: { ideal: fps, max: fps } },
            audio: withAudio
          });
          if (withAudio) {
            try {
              const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
              mic.getAudioTracks().forEach(t => captureStream.addTrack(t));
            } catch(e) {}
          }
          recordedChunks = [];
          const mimes = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
          const mime = mimes.find(m => MediaRecorder.isTypeSupported(m)) || '';
          mediaRecorder = new MediaRecorder(captureStream, mime ? { mimeType: mime } : {});
          mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: mime || 'video/webm' });
            const url = URL.createObjectURL(blob);
            document.getElementById('previewVideo').src = url;
            const dl = document.getElementById('btnDownload');
            dl.href = url;
            dl.download = `SuziCam_${new Date().toISOString().replace(/[:.]/g,'-')}.webm`;
            document.getElementById('resultCard').classList.remove('hidden');
            captureStream?.getTracks().forEach(t => t.stop());
          };
          mediaRecorder.start(200);
          isRecActive = true; isPaused = false; recStart = performance.now(); pausedTotal = 0;
          document.getElementById('resultCard').classList.add('hidden');
          document.getElementById('btnRec').style.background = '#1f2937';
          document.getElementById('btnRec').style.border = '1px solid #ef4444';
          document.getElementById('btnRec').style.color = '#f87171';
          document.getElementById('btnRecText').textContent = '■ 녹화 정지 (STOP)';
          const p = document.getElementById('btnPause');
          p.disabled = false;
          p.className = 'px-4 py-3 rounded-xl font-bold text-sm bg-neutral-700 hover:bg-neutral-600 text-white cursor-pointer transition-all';
          const sb = document.getElementById('statusBadge');
          sb.textContent = '녹화 중 (REC)';
          sb.className = 'text-xs px-2.5 py-0.5 rounded-full bg-red-950 text-red-300 font-semibold border border-red-700 rec-pulse';
          captureStream.getVideoTracks()[0].onended = () => { if (isRecActive) handleRecordToggle(); };
        } catch(err) {
          alert('화면 녹화 시작 실패: ' + err.message);
        }
      } else {
        mediaRecorder?.state !== 'inactive' && mediaRecorder.stop();
        isRecActive = false; isPaused = false;
        const r = document.getElementById('btnRec');
        r.style = '';
        r.className = 'px-6 py-3 rounded-xl font-bold text-sm bg-red-600 hover:bg-red-700 text-white transition-all flex items-center space-x-2 cursor-pointer';
        document.getElementById('btnRecText').textContent = '녹화 시작 (REC)';
        const p = document.getElementById('btnPause');
        p.disabled = true; p.textContent = '❚❚ 일시정지';
        p.className = 'px-4 py-3 rounded-xl font-bold text-sm bg-neutral-800 text-neutral-500 cursor-not-allowed transition-all';
        const sb = document.getElementById('statusBadge');
        sb.textContent = '녹화 완료';
        sb.className = 'text-xs px-2.5 py-0.5 rounded-full bg-neutral-800 text-green-400 font-semibold border border-neutral-700';
      }
    }

    function handlePauseToggle() {
      if (!mediaRecorder || !isRecActive) return;
      const p = document.getElementById('btnPause');
      const sb = document.getElementById('statusBadge');
      if (mediaRecorder.state === 'recording') {
        mediaRecorder.pause(); isPaused = true; pauseStart = performance.now();
        p.textContent = '▶ 녹화 재개';
        p.className = 'px-4 py-3 rounded-xl font-bold text-sm bg-yellow-600 hover:bg-yellow-700 text-white cursor-pointer';
        sb.textContent = '일시 정지';
        sb.className = 'text-xs px-2.5 py-0.5 rounded-full bg-yellow-950 text-yellow-300 font-semibold border border-yellow-700';
      } else if (mediaRecorder.state === 'paused') {
        mediaRecorder.resume(); isPaused = false; pausedTotal += performance.now() - pauseStart;
        p.textContent = '❚❚ 일시정지';
        p.className = 'px-4 py-3 rounded-xl font-bold text-sm bg-neutral-700 hover:bg-neutral-600 text-white cursor-pointer';
        sb.textContent = '녹화 중 (REC)';
        sb.className = 'text-xs px-2.5 py-0.5 rounded-full bg-red-950 text-red-300 font-semibold border border-red-700 rec-pulse';
      }
    }

    // ── 60FPS 모션 테스트 ──
    const canvas = document.getElementById('motionCanvas');
    const ctx = canvas.getContext('2d');
    let bx = 15, bs = 3.5, lastFt = performance.now(), fc = 0;

    function drawMotion(t) {
      fc++;
      if (t - lastFt >= 1000) {
        document.getElementById('fpsDisplay').textContent = fc + ' FPS';
        fc = 0; lastFt = t;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff4444';
      ctx.beginPath(); ctx.arc(bx, 25, 9, 0, Math.PI * 2); ctx.fill();
      ctx.save();
      ctx.translate(canvas.width / 2, 50); ctx.rotate(t / 160);
      ctx.fillStyle = '#00e5ff';
      ctx.fillRect(-18,-2,36,4); ctx.fillRect(-2,-18,4,36);
      ctx.restore();
      bx += bs;
      if (bx > canvas.width - 15 || bx < 15) bs = -bs;
      requestAnimationFrame(drawMotion);
    }
    requestAnimationFrame(drawMotion);

    // ── 비프음 싱크 테스트 ──
    let audioCtx = null, beepTimer = null, beepOn = false;
    function triggerBeep() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = 1000; g.gain.value = 0.08;
      o.start(); o.stop(audioCtx.currentTime + 0.08);
    }
    function toggleBeepSound() {
      beepOn = !beepOn;
      const btn = document.getElementById('btnBeep');
      if (beepOn) {
        btn.textContent = '🔊 비프음 끄기';
        btn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-green-700 text-white cursor-pointer';
        triggerBeep(); beepTimer = setInterval(triggerBeep, 1000);
      } else {
        btn.textContent = '🔈 1초 비프음 켜기';
        btn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold bg-neutral-800 hover:bg-neutral-700 text-yellow-300 border border-neutral-700 cursor-pointer';
        clearInterval(beepTimer);
      }
    }

    // ── 마우스 클릭 감지 ──
    let clicks = 0;
    function handleClickTarget() {
      clicks++;
      const box = document.getElementById('clickTarget');
      document.getElementById('clickTargetText').textContent = `🎯 클릭 감지됨! (누적: ${clicks}회)`;
      box.style.background = 'rgba(127,29,29,0.4)';
      setTimeout(() => box.style.background = '', 120);
    }
  </script>
</body>
</html>
