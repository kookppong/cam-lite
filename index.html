<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수지캠 (SuziCam) v0.1.0-test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f1015;
      color: #f1f2f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      user-select: none;
    }
    .digital-font {
      font-family: 'Consolas', monospace;
      text-shadow: 0 0 12px rgba(80, 250, 123, 0.6);
    }
    .rec-pulse {
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.96); }
    }
  </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">

  <div class="w-full max-w-lg bg-[#181920] border border-[#2b2d3a] rounded-2xl p-5 shadow-2xl space-y-4">
    
    <!-- 1. 타이틀 바 & 버전 넘버링 표시부 -->
    <div class="flex items-center justify-between border-b border-[#2b2d3a] pb-3">
      <div class="flex items-center space-x-2">
        <span class="w-3.5 h-3.5 rounded-full bg-red-600 inline-block shadow-[0_0_8px_#ff3333]"></span>
        <h1 class="text-base font-extrabold tracking-wide text-white">수지캠 (SUZICAM)</h1>
        <!-- 테스트 버전 넘버링 -->
        <span class="px-2 py-0.5 text-xs font-bold bg-red-950 text-red-300 border border-red-800 rounded-md">
          v0.1.0-test
        </span>
      </div>
      <div class="flex items-center space-x-2">
        <span id="envBadge" class="text-[11px] px-2 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-800">
          환경 감지 중...
        </span>
        <span id="statusBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-neutral-800 text-green-400 font-semibold border border-neutral-700">
          대기 중
        </span>
      </div>
    </div>

    <!-- 2. 디지털 타이머 및 녹화 컨트롤 -->
    <div class="bg-black/90 border border-[#2b2d3a] rounded-xl p-4 text-center space-y-3">
      <div class="text-[11px] text-neutral-400 font-medium tracking-wider">
        녹화 시간 (RECORDING TIMER)
      </div>
      <div id="recTimer" class="digital-font text-5xl font-bold text-green-400">
        00:00:00.000
      </div>

      <!-- 제어 버튼부 -->
      <div class="flex items-center justify-center space-x-3 pt-2">
        <button id="btnRec" onclick="handleRecordToggle()" 
          class="px-6 py-3 rounded-xl font-bold text-sm bg-red-600 hover:bg-red-700 active:scale-95 text-white shadow-[0_4px_15px_rgba(255,0,0,0.4)] transition-all flex items-center space-x-2 cursor-pointer">
          <span class="w-3 h-3 rounded-full bg-white"></span>
          <span id="btnRecText">녹화 시작 (REC)</span>
        </button>
        <button id="btnPause" onclick="handlePauseToggle()" disabled
          class="px-4 py-3 rounded-xl font-bold text-sm bg-neutral-800 text-neutral-500 cursor-not-allowed transition-all">
          ❚❚ 일시정지
        </button>
      </div>

      <!-- 옵션 선택 바 -->
      <div class="flex items-center justify-around pt-2 text-xs text-neutral-300 border-t border-neutral-800/80">
        <label class="flex items-center space-x-1 cursor-pointer">
          <input type="checkbox" id="chkAudio" checked class="accent-red-600 cursor-pointer">
          <span>오디오(시스템/마이크) 포함</span>
        </label>
        <div class="flex items-center space-x-1">
          <span>FPS:</span>
          <select id="selFps" class="bg-neutral-800 text-white rounded px-1.5 py-0.5 border border-neutral-700 text-xs">
            <option value="60" selected>60 FPS</option>
            <option value="30">30 FPS</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 3. 실시간 화면 검증 테스트 벤치 (FPS / 사운드 싱크 / 마우스 반응) -->
    <div class="bg-[#12131a] border border-[#2b2d3a] rounded-xl p-3 space-y-2">
      <div class="text-xs font-bold text-neutral-300 flex items-center justify-between">
        <span>🧪 실시간 녹화 테스트 벤치</span>
        <span class="text-[11px] text-neutral-400 font-normal">녹화 중 화면 변화 검증</span>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <!-- 60FPS 애니메이션 박스 -->
        <div class="bg-black/60 border border-neutral-800 rounded-lg p-2.5 flex flex-col items-center">
          <div class="flex items-center justify-between w-full text-[11px] mb-1">
            <span class="text-neutral-400">FPS 모션 검증</span>
            <span id="fpsDisplay" class="text-cyan-400 font-mono font-bold">60 FPS</span>
          </div>
          <canvas id="motionCanvas" width="180" height="70" class="rounded bg-black border border-neutral-900"></canvas>
          <div class="text-[10px] text-neutral-400 mt-1">공의 잔상 및 프레임 드랍 확인</div>
        </div>

        <!-- 1초 싱크 비프음 -->
        <div class="bg-black/60 border border-neutral-800 rounded-lg p-2.5 flex flex-col items-center justify-between">
          <div class="text-[11px] text-neutral-400 w-full text-left">오디오 싱크 검증</div>
          <button id="btnBeep" onclick="toggleBeepSound()" 
            class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-neutral-800 hover:bg-neutral-700 text-yellow-300 border border-neutral-700 cursor-pointer transition">
            🔈 1초 비프음 켜기
          </button>
          <div class="text-[10px] text-neutral-400 text-center">녹화본의 음성-화면 일치 확인</div>
        </div>
      </div>

      <!-- 마우스 클릭 영역 -->
      <div id="clickTarget" onclick="handleClickTarget()"
        class="border border-dashed border-neutral-700 hover:border-red-500 rounded-lg py-2 text-center cursor-pointer transition bg-black/40">
        <span id="clickTargetText" class="text-xs text-neutral-300">
          🖱️ 마우스 클릭 테스트 (여기를 클릭하세요 - 감지: 0)
        </span>
      </div>
    </div>

    <!-- 4. 녹화 완료 미리보기 및 다운로드 영역 -->
    <div id="resultCard" class="hidden bg-[#12131a] border border-green-600/50 rounded-xl p-3 space-y-2">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-green-400 flex items-center space-x-1">
          <span>✓</span> <span>녹화가 성공적으로 완료되었습니다!</span>
        </span>
        <a id="btnDownload" href="#" download="suzicam_record.webm" 
          class="px-3 py-1 text-xs font-bold bg-green-600 hover:bg-green-700 text-white rounded-lg transition shadow">
          💾 영상 다운로드
        </a>
      </div>
      <video id="previewVideo" controls class="w-full rounded bg-black max-h-48 border border-neutral-800"></video>
    </div>

    <!-- 5. 깃허브 및 버전 정보 푸터 -->
    <div class="flex items-center justify-between pt-2 border-t border-[#2b2d3a] text-[11px] text-neutral-400">
      <div>
        <span>빌드: </span>
        <span class="text-neutral-300 font-mono font-medium">v0.1.0-test (Alpha)</span>
      </div>
      <a href="https://github.com/kookppong/cam-lite" target="_blank" class="hover:text-white transition underline">
        GitHub Repository
      </a>
    </div>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
