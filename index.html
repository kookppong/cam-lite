<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>수지캠 (SuziCam) v0.1.0-test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0f1015;
      color: #f1f2f6;
      font-family: "Malgun Gothic", "Segoe UI", sans-serif;
      user-select: none;
      overflow-x: hidden;
      min-height: 100vh;
    }
    .digital { font-family: 'Consolas', monospace; }
    .timer-idle  { color: #374151; }
    .timer-on    { color: #4ade80; text-shadow: 0 0 14px rgba(74,222,128,.65); }
    .rec-dot     { animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .drag-region { -webkit-app-region: drag; }
    .no-drag     { -webkit-app-region: no-drag; }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-3">

  <!-- 메인 창 컨테이너 -->
  <div class="w-full max-w-md bg-[#181920] border border-[#2b2d3a] rounded-2xl shadow-2xl overflow-hidden flex flex-col">

    <!-- 타이틀바 -->
    <div class="drag-region flex items-center justify-between px-4 py-3 bg-[#0a0b10] border-b border-[#1e1f2b]">
      <div class="flex items-center space-x-2">
        <span class="w-3 h-3 rounded-full bg-red-600 inline-block" id="recDot" style="box-shadow:0 0 6px #ff3333"></span>
        <span class="text-sm font-extrabold text-white tracking-wide">수지캠 (SUZICAM)</span>
        <span class="text-xs px-1.5 py-0.5 bg-red-950 text-red-300 border border-red-800 rounded font-bold">v0.1.0-test</span>
      </div>
      <div class="no-drag flex items-center space-x-1">
        <button onclick="if(window.ipcRenderer) ipcRenderer.send('win-minimize')"
          class="w-7 h-7 rounded hover:bg-[#2b2d3a] text-neutral-400 hover:text-white text-xs flex items-center justify-center cursor-pointer">─</button>
        <button onclick="if(window.ipcRenderer) ipcRenderer.send('win-close')"
          class="w-7 h-7 rounded hover:bg-red-700 text-neutral-400 hover:text-white text-xs flex items-center justify-center cursor-pointer">✕</button>
      </div>
    </div>

    <!-- 본문 내용 -->
    <div class="p-4 space-y-3">

      <!-- 타이머 -->
      <div class="bg-black/90 border border-[#1e1f2b] rounded-xl p-4 text-center flex flex-col items-center space-y-2">
        <div class="text-[11px] text-neutral-500 tracking-widest uppercase font-medium">Recording Timer</div>
        <div id="recTimer" class="digital text-5xl font-bold timer-idle">00:00:00.000</div>
        <div class="flex items-center space-x-2">
          <span id="statusBadge" class="text-xs px-3 py-0.5 rounded-full bg-neutral-900 text-neutral-500 border border-neutral-800 font-semibold">대기 중</span>
          <span id="orientBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-neutral-900 text-cyan-400 border border-neutral-800 font-medium">모니터 방향: 가로</span>
        </div>
      </div>

      <!-- 녹화 영역 설정 (반디캠 방식) -->
      <div class="bg-[#13141c] border border-[#1e1f2b] rounded-xl p-3.5 space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-neutral-200">📐 녹화 영역 지정</span>
          <span id="areaModeBadge" class="text-xs px-2 py-0.5 rounded bg-neutral-800 text-neutral-400 border border-neutral-700">전체 화면</span>
        </div>
        <div class="grid grid-cols-4 gap-2 text-xs">
          <div class="bg-black/60 border border-neutral-800 rounded-lg p-2 text-center">
            <div class="text-neutral-500 mb-0.5">X</div>
            <div id="areaX" class="text-cyan-400 font-mono font-bold">-</div>
          </div>
          <div class="bg-black/60 border border-neutral-800 rounded-lg p-2 text-center">
            <div class="text-neutral-500 mb-0.5">Y</div>
            <div id="areaY" class="text-cyan-400 font-mono font-bold">-</div>
          </div>
          <div class="bg-black/60 border border-neutral-800 rounded-lg p-2 text-center">
            <div class="text-neutral-500 mb-0.5">너비</div>
            <div id="areaW" class="text-cyan-400 font-mono font-bold">전체</div>
          </div>
          <div class="bg-black/60 border border-neutral-800 rounded-lg p-2 text-center">
            <div class="text-neutral-500 mb-0.5">높이</div>
            <div id="areaH" class="text-cyan-400 font-mono font-bold">전체</div>
          </div>
        </div>
        <div class="flex space-x-2 pt-0.5">
          <button id="btnArea" onclick="openAreaSelector()"
            class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-blue-700 hover:bg-blue-600 text-white transition cursor-pointer">
            🖱️ 화면에서 영역 직접 설정
          </button>
          <button onclick="resetArea()"
            class="px-3.5 py-2.5 rounded-xl text-xs font-bold bg-neutral-800 hover:bg-neutral-700 text-neutral-300 border border-neutral-700 cursor-pointer transition">
            초기화
          </button>
        </div>
      </div>

      <!-- 세로모드/화면 회전 및 오디오 & FPS 옵션 -->
      <div class="bg-[#13141c] border border-[#1e1f2b] rounded-xl p-3 space-y-2 text-xs text-neutral-300">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <label class="flex items-center space-x-1.5 cursor-pointer">
              <input type="checkbox" id="chkSys" checked class="accent-red-600 w-4 h-4 cursor-pointer">
              <span>PC 소리</span>
            </label>
            <label class="flex items-center space-x-1.5 cursor-pointer">
              <input type="checkbox" id="chkMic" class="accent-red-600 w-4 h-4 cursor-pointer">
              <span>마이크</span>
            </label>
          </div>
          <div class="flex items-center space-x-1.5">
            <span>FPS:</span>
            <select id="selFps" class="bg-neutral-800 text-white rounded px-2 py-1 border border-neutral-700 text-xs">
              <option value="60" selected>60</option>
              <option value="30">30</option>
            </select>
          </div>
        </div>

        <!-- 세로모드 및 회전 제어 옵션 -->
        <div class="flex items-center justify-between pt-1 border-t border-neutral-800/80">
          <span class="text-neutral-400">화면 방향 / 회전:</span>
          <select id="selRotate" onchange="onRotateSettingChange()" class="bg-neutral-800 text-cyan-400 rounded px-2 py-1 border border-neutral-700 text-xs font-medium cursor-pointer">
            <option value="auto" selected>세로모드 자동 감지</option>
            <option value="0">기본 (0°)</option>
            <option value="90">시계방향 90° 회전</option>
            <option value="180">상하 반전 180°</option>
            <option value="270">반시계방향 270° (90° 세로)</option>
          </select>
        </div>
      </div>

      <!-- REC / PAUSE 버튼 -->
      <div class="flex space-x-2.5 pt-1">
        <button id="btnRec" onclick="toggleRecord()"
          class="flex-1 py-3.5 rounded-xl font-extrabold text-sm bg-red-600 hover:bg-red-700 text-white transition flex items-center justify-center space-x-2 cursor-pointer"
          style="box-shadow:0 4px 15px rgba(255,0,0,0.4)">
          <span class="w-3 h-3 rounded-full bg-white inline-block"></span>
          <span id="btnRecTxt">녹화 시작</span>
        </button>
        <button id="btnPause" onclick="togglePause()" disabled
          class="px-5 py-3.5 rounded-xl font-bold text-sm bg-neutral-800 text-neutral-500 cursor-not-allowed transition">
          ❚❚
        </button>
      </div>

      <!-- 녹화 완료 결과 -->
      <div id="resultCard" class="hidden bg-[#13141c] border border-green-700/40 rounded-xl p-3 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-green-400">✓ 녹화 완료!</span>
          <div class="flex items-center space-x-1.5">
            <button onclick="rotatePreviewVideo()" class="px-2.5 py-1 text-xs font-semibold bg-neutral-800 hover:bg-neutral-700 text-cyan-300 rounded border border-neutral-700 transition flex items-center space-x-1 cursor-pointer">
              <span>🔄</span><span id="lblRotateAngle">화면 90° 돌리기</span>
            </button>
            <a id="btnDl" href="#" download="SuziCam.webm"
              class="px-3 py-1 text-xs font-bold bg-green-700 hover:bg-green-600 text-white rounded transition">💾 다운로드</a>
          </div>
        </div>
        <div class="flex justify-center bg-black rounded p-1 overflow-hidden">
          <video id="prevVideo" controls class="rounded max-h-56 max-w-full transition-transform duration-300"></video>
        </div>
      </div>

    </div>

    <!-- 푸터 -->
    <div class="px-4 py-2.5 bg-[#0a0b10] border-t border-[#1e1f2b] flex items-center justify-between text-[11px] text-neutral-500">
      <span>수지캠 v0.1.0-test</span>
      <a href="https://github.com/kookppong/cam-lite" target="_blank" class="hover:text-white underline transition">
        GitHub Releases (.exe 다운로드)
      </a>
    </div>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
